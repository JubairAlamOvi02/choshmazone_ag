<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle/Rounded Box -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Sunglasses Frame -->
  <g transform="translate(256, 230)">
    <!-- Bridge -->
    <path d="M -24 -6 Q 0 -22 24 -6" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Left Lens Frame & Fill -->
    <rect x="-185" y="-60" width="150" height="110" rx="35" fill="#0F172A" stroke="url(#gold)" stroke-width="14"/>
    <path d="M -160 -35 L -60 -35" stroke="white" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right Lens Frame & Fill -->
    <rect x="35" y="-60" width="150" height="110" rx="35" fill="#0F172A" stroke="url(#gold)" stroke-width="14"/>
    <path d="M 60 -35 L 160 -35" stroke="white" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Temple Hints -->
    <path d="M -185 -30 L -215 -45" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 185 -30 L 215 -45" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Text -->
  <text x="256" y="420" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" fill="url(#gold)" letter-spacing="8" text-anchor="middle">CHOSHMA</text>
</svg>
